<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚙️ Admin Panel - BusTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f14;
      --panel: #13161e;
      --card: #1a1e2a;
      --border: #252a38;
      --accent: #f5a623;
      --green: #22c55e;
      --red: #ef4444;
      --text: #e8eaf0;
      --muted: #6b7280;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
    }

    header h1 span { color: var(--accent); }

    header a {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    header a:hover { border-color: var(--accent); }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── BUS GRID ── */
    .bus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .bus-edit-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      transition: border-color 0.2s;
    }

    .bus-edit-card:hover { border-color: var(--accent); }

    .bus-edit-card h3 {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 6px;
    }

    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-success { background: var(--green); color: #000; }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--green);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 22px;
      border-radius: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ── ADD BUS FORM ── */
    .add-bus-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }

    .add-bus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<header>
  <h1>⚙️ Admin <span>Panel</span></h1>
  <a href="/">← Back to Live Map</a>
</header>

<main>

  <!-- ── EDIT EXISTING BUSES ────────────────────────────────────────────── -->
  <p class="section-title">📋 Manage Buses</p>

  <div class="bus-grid" id="bus-grid">
    <!-- Cards injected by JS -->
  </div>

  <!-- ── ADD NEW BUS ─────────────────────────────────────────────────────── -->
  <p class="section-title">➕ Add New Bus</p>

  <div class="add-bus-form">
    <div class="add-bus-grid">
      <div class="form-group">
        <label>Bus ID (e.g. BUS-04)</label>
        <input type="text" id="new-id" placeholder="BUS-04"/>
      </div>
      <div class="form-group">
        <label>Route Name</label>
        <input type="text" id="new-name" placeholder="Route D - North Campus"/>
      </div>
      <div class="form-group">
        <label>Driver Name</label>
        <input type="text" id="new-driver" placeholder="Driver Name"/>
      </div>
      <div class="form-group">
        <label>Latitude</label>
        <input type="number" id="new-lat" placeholder="28.6139" step="0.0001"/>
      </div>
      <div class="form-group">
        <label>Longitude</label>
        <input type="number" id="new-lng" placeholder="77.2090" step="0.0001"/>
      </div>
    </div>
    <button class="btn btn-success" onclick="addBus()">➕ Add Bus to System</button>
  </div>

</main>

<div class="toast" id="toast">✅ Updated!</div>

<script>
  // ── LOAD BUSES ────────────────────────────────────────────────────────────
  function loadBuses() {
    fetch('/api/buses')
      .then(r => r.json())
      .then(buses => {
        const grid = document.getElementById('bus-grid');
        grid.innerHTML = Object.entries(buses).map(([id, b]) => `
          <div class="bus-edit-card">
            <h3>🚌 ${id}</h3>

            <div class="form-group">
              <label>Route Name</label>
              <input type="text" id="${id}-name" value="${b.name}"/>
            </div>

            <div class="form-group">
              <label>Driver</label>
              <input type="text" id="${id}-driver" value="${b.driver}"/>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Latitude</label>
                <input type="number" id="${id}-lat" value="${b.lat}" step="0.0001"/>
              </div>
              <div class="form-group">
                <label>Longitude</label>
                <input type="number" id="${id}-lng" value="${b.lng}" step="0.0001"/>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Speed (km/h)</label>
                <input type="number" id="${id}-speed" value="${b.speed}"/>
              </div>
              <div class="form-group">
                <label>Passengers</label>
                <input type="number" id="${id}-passengers" value="${b.passengers}"/>
              </div>
            </div>

            <div class="form-group">
              <label>Status</label>
              <select id="${id}-status">
                <option ${b.status === 'Running' ? 'selected' : ''}>Running</option>
                <option ${b.status === 'Stopped' ? 'selected' : ''}>Stopped</option>
              </select>
            </div>

            <button class="btn btn-primary" onclick="updateBus('${id}')">💾 Update Bus</button>
          </div>
        `).join('');
      });
  }

  // ── UPDATE BUS ────────────────────────────────────────────────────────────
  function updateBus(id) {
    const data = {
      bus_id: id,
      name:       document.getElementById(id + '-name').value,
      driver:     document.getElementById(id + '-driver').value,
      lat:        parseFloat(document.getElementById(id + '-lat').value),
      lng:        parseFloat(document.getElementById(id + '-lng').value),
      speed:      parseInt(document.getElementById(id + '-speed').value),
      passengers: parseInt(document.getElementById(id + '-passengers').value),
      status:     document.getElementById(id + '-status').value
    };

    fetch('/api/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(() => showToast('✅ ' + id + ' updated!'));
  }

  // ── ADD NEW BUS ───────────────────────────────────────────────────────────
  function addBus() {
    const data = {
      bus_id: document.getElementById('new-id').value,
      name:   document.getElementById('new-name').value,
      driver: document.getElementById('new-driver').value,
      lat:    document.getElementById('new-lat').value || 28.6139,
      lng:    document.getElementById('new-lng').value || 77.2090,
    };

    if (!data.bus_id) { alert('Please enter a Bus ID'); return; }

    fetch('/api/add_bus', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(r => r.json()).then(res => {
      if (res.success) {
        showToast('🚌 New bus added!');
        ['new-id','new-name','new-driver','new-lat','new-lng'].forEach(id => {
          document.getElementById(id).value = '';
        });
        loadBuses();
      } else {
        alert('Error: ' + res.error);
      }
    });
  }

  // ── TOAST NOTIFICATION ────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  loadBuses();
</script>
</body>
</html>
